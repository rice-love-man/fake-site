<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>偽サイトだよーーーーーーーーーーーーーーーーーーーーーーーーーーーーーーー</title>
    <style>
        body{
            padding: 10px 10px;
            background-color: red;
            width: 700px;
            height: 1200px;
            transition: background-color 0.1s;
        }
        h1{
            color: black;
            margin: 0;
            padding: 10px 0;
            font-family: "Hiragino Mincho ProN","MS Mincho",serif;
        }
        .big-h1{
            font-size:50px;
        }
        .small-h1{
            font-size: 20px;
            position: relative;
            left: 20px;
        } 
        .shikaku{
            width: 60vw;
            height: 200px;
            background-color: white;
            color: rgb(123, 82, 255);
            animation: expansion 1s infinite ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            position: absolute;
            top: 300px;
            right: 20vw;
            cursor: pointer;
            font-family: "Hiragino Mincho ProN","MS Mincho",serif;
        }
        .shikaku2{
            width: 80vw;
            height: 200px;
            background-color: rgb(176, 93, 93);
            position: absolute;
            top: 1000px;
            right: 10vw;
            display: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-family: "Hiragino Mincho ProN","MS Mincho",serif;
        }
        @keyframes expansion{
            0%{transform: scale(1);}
            50%{transform: scale(1.2);}
            100%{transform: scale(1);}
        }
    </style>
</head>
<body>
    <div class="shikaku" id="shikaku"></div>
    <div class="shikaku2" id="shikaku2"></div>
    <div id="area"></div>
    <script>
        const shi = document.getElementById("shikaku");
        const area = document.getElementById("area");
        shi.innerText = "お使いのデバイスはウイルスに感染しました\n対処方法をクリックして確認してください";
        const shi2 = document.getElementById("shikaku2");

        // shikakuを押したときの挙動

        shi.onclick = ()=>{
            alert("今すぐシャットダウンをしてください");
            shi.style.display ="none";
            for(let i = 1; i <= 3; i++){
                console.log("デバイスが再起不能状態になります")
            }
            area.innerHTML = "<h1 class='big-h1'>再起不能になるまであと30秒</h1>";
            setTimeout(() => {
                area.innerHTML = "<h1 class='big-h1'>ファイルが消されています</h1>";
                area.innerHTML += "<h1 class='big-h1'>個人情報が抜き取られています</h1>";
                area.innerHTML += "<h1 class='small-h1'>下の方の対処方法のところをクリックしてください</h1>";

                shi2.style.display = "flex";
                shi2.innerText = "対処方法";   
            }, 2000);
        };
            // shikaku2の挙動
        shi2.onclick = ()=>{
            shi2.innerText = "請求額は100万円です。支払い方法は銀行振込のみです。払いますか？";
            area.innerHTML = `
                <div style="
                    position: absolute;
                    top: 800px;
                    right: 10vw;
                    display: flex;
                    flex-direction: column;
                    gap: 10px;
                ">
                  
                    <input type="text" id="user-answer"
                        style="width: 1000px; 
                        font-size: 30px;
                        font-family: 'Hiragino Mincho ProN','MS Mincho',serif;"
                        placeholder="払いますか？はいで答えてください。Will you pay? Please answer yes.">
                            
                    <button id="check-btn"
                    style="font-size: 30px;
                     cursor: pointer;
                     font-family: 'Hiragino Mincho ProN','MS Mincho',serif;
                     ">送信完了ボタン Transfer now</button>
                </div>
                `;
            document.getElementById("check-btn").onclick = ()=>{
                const answer = document.getElementById("user-answer").value;
                const color = document.body.style.backgroundColor;
                if (answer === "はい"){
                    alert("誠にありがとうございました。後ほど担当者からご連絡いたします。");
                } else if (answer === "yes"){
                        alert("Thank you very much.");
                } else{
                    alert("ちゃんと入れてなかったのではいということで。ありがとうございました！");
                }
                shi2.innerText = "上に行ったら何かあるよ。";
                document.body.style.backgroundColor = "lightblue";
                setTimeout(() => {
                    shi2.style.display = "none";
                }, 5000);
                const selif = ["アホなんか！<br>ネットは怖いんだよ！<br>北極！ホッキョクグマ出てきそうワホーつって<br>とかいってるからアホになるんだよ！",
                "まあ、これはジョークウイルスだけどね！<br>この文字が明朝体ってことに気づいた人いる？まあ、気付く人は少ないと思うけど！"];
                setTimeout(() => {
                    for(let i = 0; i < selif.length; i++){
                        area.innerHTML += `<h1 class='30px'>${selif[i]}</h1>`;
                    }
                }, 2000);
            };
        };
    </script>
</body>
</html>
